<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bird Audio Suite</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#3f6d56">
    <link rel="stylesheet" href="./assets/styles.css?v=3">
  </head>
  <body>
    <div class="page-shell">
      <header class="top-bar">
        <h1>Bird Audio Suite</h1>
        <nav class="tabs" aria-label="Sezioni">
          <button class="tab active" type="button" data-view="review">Da rivedere <span id="pending-count" class="count"></span></button>
          <button class="tab" type="button" data-view="all">Osservazioni</button>
          <button class="tab" type="button" data-view="report">Report</button>
        </nav>
      </header>

      <section id="filters" class="filters hidden">
        <label>Stato
          <select id="filter-status">
            <option value="">tutti</option>
            <option value="pending">da rivedere</option>
            <option value="confirmed">confermate</option>
            <option value="rejected">scartate</option>
            <option value="uploaded">su iNaturalist</option>
          </select>
        </label>
        <label>Specie <input id="filter-species" type="search" placeholder="nome italiano, inglese o scientifico"></label>
        <label>Dal <input id="filter-from" type="date"></label>
        <label>Al <input id="filter-to" type="date"></label>
      </section>

      <main id="content" aria-live="polite"></main>
      <button id="more" class="more hidden" type="button">Carica altre</button>
      <p id="status-line" class="status-line"></p>
    </div>

    <datalist id="species-list"></datalist>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js"></script>
    <script src="./assets/config.js?v=3"></script>
    <script type="module" src="./assets/app.js?v=3"></script>
  </body>
</html>

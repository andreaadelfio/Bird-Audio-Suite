<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Bird Audio Suite</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#3f6d56">
    <!-- Installabile come app (manifest + service-worker.js), come MyFinance e Listino Prezzi -->
    <meta name="application-name" content="Uccelli">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Uccelli">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon-64.png">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="stylesheet" href="./assets/styles.css?v=52">
  </head>
  <body>
    <div class="page-shell">
      <header class="top-bar">
        <h1>Bird Audio Suite</h1>
        <nav class="tabs" aria-label="Sezioni">
          <button class="tab active" type="button" data-view="observations"
            title="Il numero è quante osservazioni sono da rivedere">Osservazioni <span id="pending-count" class="count"></span></button>
          <button class="tab" type="button" data-view="report">Report</button>
          <button class="tab" type="button" data-view="trash">Cestino <span id="trash-count" class="count trash-count"></span></button>
        </nav>
        <!-- volume of every clip, beyond 100%: always visible on a computer, behind the speaker on the phone -->
        <div id="volume-panel" class="volume-panel">
          <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>
          </svg>
          <input id="volume" type="range" min="-20" max="30" step="1" value="0" aria-label="Volume">
          <button id="volume-value" type="button" class="tool volume-value" title="Tocca per tornare al 100%">100%</button>
        </div>
        <div class="top-tools">
          <button id="volume-toggle" class="icon-button" type="button" aria-label="Volume" aria-expanded="false"
            aria-controls="volume-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>
            </svg>
          </button>
          <button id="inat-toggle" class="pill-button" type="button" title="Collega iNaturalist e carica le confermate"
            aria-expanded="false" aria-controls="inat-panel">iNat</button>
          <button id="refresh" class="icon-button" type="button" title="Ricarica" aria-label="Ricarica">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 12.65-5.65z"/>
            </svg>
          </button>
        </div>
      </header>

      <section id="inat-panel" class="inat-panel hidden" aria-label="iNaturalist">
        <div class="inat-connect">
          <h2>iNaturalist <span id="inat-state" class="inat-state"></span></h2>
          <form id="inat-token-form" class="inat-token">
            <input id="inat-token" type="password" autocomplete="off" placeholder='token: {"api_token":"..."}'>
            <button type="submit">Collega</button>
          </form>
          <p id="inat-token-hint" class="hint">
            Apri <a href="https://www.inaturalist.org/users/api_token" target="_blank" rel="noopener">la pagina del token</a>
            (con l'accesso fatto), copia tutto e incollalo qui: vale 24 ore e resta in questo browser.
          </p>
        </div>
        <div class="inat-upload">
          <div class="inat-row">
            <label class="inline-label">Posizione
              <select id="inat-geoprivacy">
                <option value="">precisa</option>
                <option value="obscured">oscurata (~20 km)</option>
                <option value="private">privata</option>
              </select>
            </label>
            <button id="inat-upload-all" class="primary" type="button">Carica le confermate</button>
          </div>
          <p class="hint">Specie corretta se indicata, fino a 5 clip (le migliori, non scartate). Se si interrompe riprende senza doppioni.</p>
          <ul id="inat-log" class="inat-log"></ul>
        </div>
      </section>

      <section id="filters" class="filters hidden" aria-label="Filtri">
        <div class="status-pills" role="group" aria-label="Stato">
          <button type="button" class="pill on" data-filter-status="">Tutte</button>
          <button type="button" class="pill" data-filter-status="pending">Da rivedere <span id="pending-pill" class="count"></span></button>
          <button type="button" class="pill" data-filter-status="confirmed">Confermate</button>
          <button type="button" class="pill" data-filter-status="rejected">Scartate</button>
        </div>
        <input id="filter-status" type="hidden" value="">
        <div class="status-pills confidence-pills" role="group" aria-label="Confidenza">
          <button type="button" class="pill pill-likely" data-filter-confidence="likely"
            title="Almeno una clip con confidenza alta">likely</button>
          <button type="button" class="pill pill-unsure" data-filter-confidence="unsure"
            title="Nessuna clip con confidenza alta">unsure</button>
        </div>
        <input id="filter-confidence" type="hidden" value="">
        <button id="select-toggle" type="button" class="pill select-toggle" aria-pressed="false"
          title="Seleziona piu' osservazioni o clip per un'azione in blocco">Seleziona</button>
        <details id="more-filters" class="more-filters">
          <summary>Specie e date <span id="filters-active" class="dot hidden"></span></summary>
          <div class="filter-fields">
            <input id="filter-species" type="search" placeholder="Specie: italiano, inglese o scientifico" aria-label="Specie">
            <label class="inline-label">dal <input id="filter-from" type="date"></label>
            <label class="inline-label">al <input id="filter-to" type="date"></label>
            <button id="filters-clear" type="button" class="tool hidden" title="Togli specie e date">✕</button>
          </div>
        </details>
      </section>

      <!-- linking a clip to another observation: what, how, and a way out -->
      <div id="link-banner" class="link-banner hidden" role="status">
        <span id="link-what"></span>
        <div class="segmented" role="group" aria-label="Come collegarla">
          <button type="button" data-link-mode="copy" title="Resta anche nella sua osservazione">anche qui</button>
          <button type="button" data-link-mode="move" title="Lascia la sua osservazione">sposta</button>
        </div>
        <button id="link-cancel" type="button">Annulla</button>
      </div>

      <main id="content" aria-live="polite"></main>
      <!-- "Seleziona": actions on what is picked, within reach of a thumb -->
      <div id="bulk-bar" class="bulk-bar hidden" role="toolbar" aria-label="Azioni sulle selezionate"></div>
      <button id="more" class="more hidden" type="button">Carica altre</button>
      <p id="status-line" class="status-line" role="status"></p>
    </div>

    <datalist id="species-list"></datalist>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js"></script>
    <!-- the iNaturalist widget of andreaadelfio.github.io (repository inat-widget), for the Report -->
    <script defer src="https://andreaadelfio.github.io/inat-widget/inat-widget-custom.js"></script>
    <script src="./assets/config.js?v=51"></script>
    <script type="module" src="./assets/app.js?v=51"></script>
  </body>
</html>
